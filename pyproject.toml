[build-system]
# 빌드 도구와 패키지 설치 메타데이터다. pip install -e .은 소스 수정이 즉시 반영된다.
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-llm-handover"
version = "0.1.0"
description = "Local AI based handover document generation and evaluation system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1.0",
    "fastapi>=0.116,<1.0",
    "jinja2>=3.1,<4.0",
    "pydantic>=2.11,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "pymupdf>=1.26,<2.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
# 기본 서버 실행과 별개로 [dev], [ocr], [rag] 기능별 의존성을 선택 설치한다.
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.4,<9.0",
    "ruff>=0.12,<1.0",
]
ocr = [
    "paddleocr>=3.0,<4.0",
    "paddlepaddle>=3.0,<4.0",
]
rag = [
    "chromadb>=1.0,<2.0",
    "sentence-transformers>=5.0,<6.0",
    # PaddleX의 PyYAML 6.0.2 고정 요구와 Kubernetes 36의 요구가 충돌한다.
    "kubernetes>=28,<36",
]

[tool.setuptools.packages.find]
where = ["src"]

# wheel 설치에서도 검토 화면을 사용할 수 있도록 정적 자산을 패키지에 포함한다.
[tool.setuptools.package-data]
handover_ai = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
# src 레이아웃을 테스트에서 import할 수 있도록 경로를 추가한다.
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
